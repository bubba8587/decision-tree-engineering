# DTE configuration. One key = value per line.  dte:B12
#
# summaries: print "ID title" (on, A5) or bare IDs (off).       dte:B16
summaries = on
#
# protect_human: human-held nodes need authorized_by to be       dte:B11
# superseded, reverted, or moved.
protect_human = on
#
# authority: advisory map of who holds each ring. "C+" means C   dte:B13
# and deeper. Binds agents, never humans. Unmapped rings mean
# "ask the human".
authority = A:human, B:orchestrator, C+:subagent
#
# scope checks (advisory).  dte:B21,C8
# docs: artifacts that describe decisions rather than implement them;
# they do not count as reach.
docs = README.md, SPEC.md, ADOPTING.md
broad_fraction = 0.3
broad_min = 5
